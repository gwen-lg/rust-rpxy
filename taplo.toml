include = ["**/Cargo.toml", "taplo.toml", "typos.toml"]
exclude = ["submodules/**"]

[formatting]
indent_string = "    "

[[rule]]
include = ["**/Cargo.toml", "taplo.toml"]
keys = [
    "dependencies",
    "dev-dependencies",
    "lints.clippy",
    "lints.rust",
    "files",
]

[rule.formatting]
reorder_keys = true
reorder_arrays = true

[[rule]]
include = ["typos.toml"]

[rule.formatting]
reorder_keys = true
reorder_arrays = true
